name: security-triage

# Dependabot/security PR triage performed AS aucteris-security (GitHub App).
# Read-mostly posture: labels + structured risk comment, never approves.
# Inert until vars.SECURITY_BOT_ENABLED=true — see
# AUCTERIS/.github/bots/README.md.

# pull_request_target for the same reason as review-triage: dependabot PRs
# get no secrets under pull_request. Read-only gh api usage only — never
# checks out PR code.
on:
  pull_request_target:
    types: [opened, synchronize]

permissions: {}

concurrency:
  group: security-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Triage dependency PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      vars.SECURITY_BOT_ENABLED == 'true' &&
      github.actor == 'dependabot[bot]'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Mint aucteris-security token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.AUCTERIS_SECURITY_APP_ID }}
          private-key: ${{ secrets.AUCTERIS_SECURITY_PRIVATE_KEY }}

      - name: Label and risk-comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh label create "dependencies" --repo "$REPO" --color 0366D6 --description "Dependency update" 2>/dev/null || true
          gh label create "security-review" --repo "$REPO" --color B60205 --description "Needs security review" 2>/dev/null || true
          gh pr edit "$PR" --repo "$REPO" --add-label "dependencies,security-review"

          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' | head -20)
          deps=$(grep -cE 'Cargo\.(toml|lock)$' <<<"$files" || true)

          # cargo-deny gates license/advisory regressions automatically;
          # the comment makes the residual risk explicit for the reviewer.
          gh pr comment "$PR" --repo "$REPO" --body "$(cat <<EOF
          <!-- aucteris-security -->
          **Dependency PR triage** (automated, read-only posture)

          - Files touched under Cargo manifests/lock: $deps
          - \`cargo deny check\` will validate licenses, RustSec advisories and source policy — a red \`deny\` check is a hard stop.
          - Review focus: does this bump cross a \`deny.toml\` allow-list boundary (e.g. new GPL, new git source, new registry)? Grouped bumps deserve a per-crate pass, not a skim.
          - Known accepted risks live in \`deny.toml\` comments — do not "fix" them here.
          EOF
          )"

      - name: Correlate alerts and diff risks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          title=$(gh pr view "$PR" --repo "$REPO" --json title --jq .title)

          # Which open Dependabot alerts does this PR likely address?
          if alerts_raw=$(gh api "repos/$REPO/dependabot/alerts?state=open&ecosystem=cargo&per_page=100" \
            --jq '[.[] | .dependency.package.name] | unique | .[]' 2>/dev/null); then
            alerts="$alerts_raw"
          else
            alerts="__api_error__"
          fi
          pkg=$(grep -oE 'Bump [a-zA-Z0-9_-]+ from' <<<"$title" | awk '{print $2}' || true)
          matched=""
          if [ "$alerts" = "__api_error__" ]; then
            matched="alert lookup unavailable (app permission or API error) — check manually"
          elif [ -n "$pkg" ] && grep -qx "$pkg" <<<"$alerts"; then
            matched="closes open alert(s) for \`$pkg\`"
          elif [ -n "$alerts" ]; then
            matched="open cargo alerts still pending: ${alerts//$'\n'/,}"
          else
            matched="no open cargo Dependabot alerts"
          fi

          # Git-sourced additions bypass crates.io review — flag them.
          git_adds=$(gh pr diff "$PR" --repo "$REPO" | grep -cE '^\+source = "git\+' || true)
          git_note="none"
          [ "$git_adds" -gt 0 ] && git_note="⚠️ **$git_adds** new git-sourced lock entries — unreviewed code path, verify the pinned rev"

          # Major version bumps change APIs — need code review beyond the lockfile.
          major_note=""
          if grep -qE 'Bump .* from [0-9]+\.' <<<"$title"; then
            from_v=$(grep -oE 'from [0-9]+' <<<"$title" | awk '{print $2}' | head -1)
            to_v=$(grep -oE 'to [0-9]+' <<<"$title" | awk '{print $2}' | head -1)
            if [ -n "$from_v" ] && [ -n "$to_v" ] && [ "$from_v" != "$to_v" ]; then
              major_note="
          - ⚠️ Major bump ($from_v → $to_v): API changes possible — the lockfile passing does NOT mean the code still compiles against it."
            fi
          fi

          body="<!-- aucteris-security:alerts -->
          **Alert correlation** (automated)

          - $title
          - $matched
          - Git-source additions: $git_note$major_note"
          # shellcheck disable=SC2001
          body=$(sed 's/^ *//' <<<"$body")

          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- aucteris-security:alerts -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" -X PATCH -f body="$body" >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -X POST -f body="$body" >/dev/null
          fi
