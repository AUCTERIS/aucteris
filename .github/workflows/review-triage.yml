name: review-triage

# Deterministic PR triage performed AS aucteris-reviewer (GitHub App).
# Inert until the app exists and vars.REVIEWER_BOT_ENABLED=true is set —
# see AUCTERIS/.github/bots/README.md for app creation + secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: review-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Label and checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: vars.REVIEWER_BOT_ENABLED == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Mint aucteris-reviewer token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.AUCTERIS_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AUCTERIS_REVIEWER_PRIVATE_KEY }}

      - name: Apply area and size labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')

          has() { grep -qE "$1" <<<"$files"; }

          labels=()
          has '^(apps/desktop|crates/harness)/' && labels+=("area/ui")
          has '^crates/core/' && labels+=("area/core")
          has '^apps/cli/' && labels+=("area/cli")
          has '^\.github/|^deny\.toml|^Cargo\.(toml|lock)|^rust-toolchain' && labels+=("area/ci")
          has '^docs/|\.md$' && labels+=("area/docs")
          has '^crates/' && labels+=("area/rust")

          # Ensure labels exist (idempotent; org may already have them)
          for l in "${labels[@]:-}"; do
            [ -z "$l" ] && continue
            gh label create "$l" --repo "$REPO" --color BFD4F2 --description "Auto-triaged area" 2>/dev/null || true
            gh pr edit "$PR" --repo "$REPO" --add-label "$l"
          done

          # Size from the PR's own additions+deletions
          stats=$(gh pr view "$PR" --repo "$REPO" --json additions,deletions --jq '.additions + .deletions')
          if [ "$stats" -lt 50 ]; then size=XS; elif [ "$stats" -lt 300 ]; then size=S
          elif [ "$stats" -lt 1000 ]; then size=M; else size=L; fi
          gh label create "size/$size" --repo "$REPO" --color C5DEF5 --description "Auto-triaged size" 2>/dev/null || true
          gh pr edit "$PR" --repo "$REPO" --add-label "size/$size"

      - name: Static diff checks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          diff=$(gh pr diff "$PR" --repo "$REPO")

          # Walk the unified diff: track the current file, inspect added lines.
          findings=""
          cur_file=""
          rust_added=0 test_added=0 src_changed=0
          unwrap_n=0 panic_n=0 unsafe_n=0
          while IFS= read -r line; do
            case "$line" in
              diff\ --git*) cur_file="${line#* b/}" ;;
              +++*) ;;
              +*)
                [ "$cur_file" = "" ] && continue
                case "$cur_file" in
                  */tests/*|*_test.rs|tests.rs) test_added=$((test_added+1)) ;;
                  *.rs)
                    rust_added=$((rust_added+1))
                    content="${line#+}"
                    grep -qE '(^|[^a-zA-Z_])(unwrap|expect)\s*\(' <<<"$content" && unwrap_n=$((unwrap_n+1))
                    grep -qE '\bpanic!|\btodo!|\bunimplemented!' <<<"$content" && panic_n=$((panic_n+1))
                    grep -qE '\bunsafe\b' <<<"$content" && unsafe_n=$((unsafe_n+1))
                    grep -qE '#\[(test|tokio::test|test_case)|#\[cfg\(test\)\]' <<<"$content" && test_added=$((test_added+1))
                    ;;
                esac
                case "$cur_file" in
                  crates/*/src/*|apps/*/src/*) src_changed=$((src_changed+1)) ;;
                esac
                ;;
            esac
          done <<<"$diff"

          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          stats=$(gh pr view "$PR" --repo "$REPO" --json additions,deletions --jq '"+\(.additions) -\(.deletions)"')

          # Trust-boundary files demand explicit human review.
          if grep -qE '^(deny\.toml|\.github/workflows/|\.cargo/|rust-toolchain\.toml|CODEOWNERS|\.github/CODEOWNERS)' <<<"$files"; then
            findings="$findings
          - ⚠️ Touches trust-boundary files (CI/deny/toolchain) — requires maintainer review, bots cannot approve."
            gh label create "needs-human-review" --repo "$REPO" --color D93F0B --description "Touches trust boundaries" 2>/dev/null || true
            gh pr edit "$PR" --repo "$REPO" --add-label "needs-human-review"
          fi

          [ "$unwrap_n" -gt 0 ] && findings="$findings
          - \`unwrap()/expect()\` added: **$unwrap_n** line(s) — verify error paths can't panic on untrusted input."
          [ "$panic_n" -gt 0 ] && findings="$findings
          - \`panic!/todo!/unimplemented!\` added: **$panic_n** line(s)."
          [ "$unsafe_n" -gt 0 ] && findings="$findings
          - \`unsafe\` added: **$unsafe_n** line(s) — needs a safety comment and reviewer sign-off."
          if [ "$src_changed" -gt 20 ] && [ "$test_added" -eq 0 ]; then
            findings="$findings
          - Source changed (**$src_changed** added src lines) with **no test changes** — consider coverage for new behavior."
          fi

          [ -z "$findings" ] && findings="
          - No unwrap/expect/panic/unsafe additions; test coverage present or N/A."

          body="<!-- aucteris-reviewer:static -->
          **Static review** (deterministic, \`aucteris-reviewer\`)

          - Diff: $(wc -l <<<"$files" | tr -d ' ') files, $stats
          - Rust lines added: $rust_added$findings"
          # shellcheck disable=SC2001
          body=$(sed 's/^ *//' <<<"$body")

          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- aucteris-reviewer:static -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api "repos/$REPO/issues/comments/$existing" -X PATCH -f body="$body" >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -X POST -f body="$body" >/dev/null
          fi

      - name: Remind about PR template if sections are missing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          missing=""
          grep -q '## Summary' <<<"$BODY" || missing="$missing Summary"
          grep -q '## Security notes' <<<"$BODY" || missing="$missing Security-notes"
          [ -z "$missing" ] && exit 0
          gh pr comment "$PR" --repo "$REPO" --body "$(cat <<EOF
          <!-- aucteris-reviewer -->
          PR template incomplete — missing section(s):$missing.
          Please fill the template so reviewers can verify trust-boundary impact.
          EOF
          )"
