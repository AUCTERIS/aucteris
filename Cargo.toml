[workspace]
resolver = "2"
members = ["apps/cli", "apps/desktop", "crates/core"]
default-members = ["apps/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
aucteris-core = { path = "crates/core" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = "3"
futures = "0.3"
futures-util = "0.3.34"
gpui = { git = "https://github.com/jomvick/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a" }
gpui_platform = { git = "https://github.com/jomvick/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a", features = ["wayland", "x11", "font-kit", "runtime_shaders"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
reqwest = "0.13"
restate-sdk = { version = "0.12", features = ["reqwest-client"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread"] }
temporalio-client = "1.2.0"
temporalio-common = "1.2.0"
temporalio-macros = "1.2.0"
temporalio-sdk = "1.2.0"
temporalio-workflow = "1.2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
