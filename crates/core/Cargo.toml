[package]
name = "aucteris-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
futures-util.workspace = true
libc.workspace = true
reqwest.workspace = true
restate-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
temporalio-client.workspace = true
temporalio-common.workspace = true
temporalio-macros.workspace = true
temporalio-sdk.workspace = true
temporalio-workflow.workspace = true
tokio.workspace = true
tracing.workspace = true

# futures and temporalio-common/workflow have no direct `use` in our sources
# but are referenced by code generated from #[activities]/#[workflow] macros
# — cargo-machete cannot see macro-expanded paths.
[package.metadata.cargo-machete]
ignored = ["futures", "temporalio-common", "temporalio-workflow"]

[dev-dependencies]
serde_yaml.workspace = true
tempfile = "3"
