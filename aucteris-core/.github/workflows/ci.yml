name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc (temporalio-protos build dep)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

  durable-integration:
    # Real restate-server + real service + real kill/restart drill.
    # Uses the deterministic `mock` runtime — no provider credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc (temporalio-protos build dep)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build aucteris
        run: cargo build

      - name: Install restate-server
        run: |
          curl -sL -o /tmp/restate.tar.xz \
            https://github.com/restatedev/restate/releases/download/v1.8.1/restate-server-x86_64-unknown-linux-musl.tar.xz
          tar -xf /tmp/restate.tar.xz -C /tmp
          mkdir -p "$RUNNER_TEMP/restate-bin"
          cp /tmp/restate-server-x86_64-unknown-linux-musl/restate-server "$RUNNER_TEMP/restate-bin/"

      - name: Start restate-server
        run: |
          "$RUNNER_TEMP/restate-bin/restate-server" \
            --base-dir "$RUNNER_TEMP/restate-data" --node-name ci-node \
            > "$RUNNER_TEMP/restate.log" 2>&1 &
          for i in $(seq 1 30); do
            (exec 3<>/dev/tcp/localhost/9070) 2>/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/restate.log"; exit 1

      - name: Start aucteris service
        env:
          AUCTERIS_DATA_DIR: ${{ runner.temp }}/aucteris-data
        run: |
          ./target/debug/aucteris-core serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/serve.pid"
          for i in $(seq 1 20); do
            (exec 3<>/dev/tcp/localhost/9080) 2>/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/serve.log"; exit 1

      - name: Register deployment
        run: |
          curl -sf -X POST localhost:9070/deployments \
            -H 'content-type: application/json' \
            -d '{"uri":"http://localhost:9080"}' >/dev/null

      - name: Durable mission end-to-end
        env:
          AUCTERIS_DATA_DIR: ${{ runner.temp }}/aucteris-data
        run: |
          OUT=$(./target/debug/aucteris-core run-durable tests/fixtures/mission-mock-ok.yaml)
          echo "$OUT"
          MID=$(echo "$OUT" | sed -n 's/mission \(m-[^ ]*\).*/\1/p')
          test -n "$MID"
          for i in $(seq 1 60); do
            F="$AUCTERIS_DATA_DIR/missions/$MID/durable-result.json"
            [ -f "$F" ] && grep -q "write:completed" "$F" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/serve.log"; exit 1

      - name: Approval gate (reject)
        env:
          AUCTERIS_DATA_DIR: ${{ runner.temp }}/aucteris-data
        run: |
          OUT=$(./target/debug/aucteris-core run-durable tests/fixtures/mission-mock-approval.yaml --approval)
          MID=$(echo "$OUT" | sed -n 's/mission \(m-[^ ]*\).*/\1/p')
          test -n "$MID"
          # Wait for the awakeable to be journaled, then reject.
          for i in $(seq 1 30); do
            [ -f "$AUCTERIS_DATA_DIR/missions/$MID/approval.json" ] && break
            sleep 1
          done
          ./target/debug/aucteris-core approve "$MID" rejected
          for i in $(seq 1 30); do
            F="$AUCTERIS_DATA_DIR/missions/$MID/durable-result.json"
            [ -f "$F" ] && grep -q "rejected" "$F" && exit 0
            sleep 1
          done
          exit 1

      - name: Kill service mid-attempt, verify reconcile
        env:
          AUCTERIS_DATA_DIR: ${{ runner.temp }}/aucteris-data
        run: |
          OUT=$(./target/debug/aucteris-core run-durable tests/fixtures/mission-mock-sleep.yaml)
          MID=$(echo "$OUT" | sed -n 's/mission \(m-[^ ]*\).*/\1/p')
          test -n "$MID"
          echo "mission=$MID"
          # Wait until the attempt is actually running, then kill -9.
          for i in $(seq 1 30); do
            ls "$AUCTERIS_DATA_DIR/missions/$MID/attempts/"*.json >/dev/null 2>&1 && break
            sleep 1
          done
          ls "$AUCTERIS_DATA_DIR/missions/$MID/attempts/"
          sleep 3
          kill -9 "$(cat "$RUNNER_TEMP/serve.pid")" || true
          echo "serve killed"
          # Restart the service; Restate retries the activity.
          ./target/debug/aucteris-core serve > "$RUNNER_TEMP/serve2.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/serve.pid"
          sleep 2
          cat "$RUNNER_TEMP/serve2.log"
          for i in $(seq 1 150); do
            F="$AUCTERIS_DATA_DIR/missions/$MID/durable-result.json"
            [ -f "$F" ] && grep -q "slow-write:completed" "$F" && break
            sleep 1
          done
          echo "=== durable-result ==="
          cat "$AUCTERIS_DATA_DIR/missions/$MID/durable-result.json" 2>/dev/null || echo MISSING
          grep -q "slow-write:completed" "$AUCTERIS_DATA_DIR/missions/$MID/durable-result.json"
          # The interrupted attempt must be recorded unknown, and a
          # second attempt must exist — no silent single-run pretense.
          echo "=== evidence tail ==="
          tail -8 "$AUCTERIS_DATA_DIR/missions/$MID/evidence.jsonl"
          grep -q "marked unknown" "$AUCTERIS_DATA_DIR/missions/$MID/evidence.jsonl"
          echo "=== attempts ==="
          ls "$AUCTERIS_DATA_DIR/missions/$MID/attempts/"
          test "$(ls "$AUCTERIS_DATA_DIR/missions/$MID/attempts/"*.json | wc -l)" -eq 2

      - name: Dump mission artifacts on failure
        if: failure()
        env:
          AUCTERIS_DATA_DIR: ${{ runner.temp }}/aucteris-data
        run: |
          echo "=== serve.log ==="; cat "$RUNNER_TEMP/serve.log" 2>/dev/null | tail -30
          echo "=== serve2.log ==="; cat "$RUNNER_TEMP/serve2.log" 2>/dev/null | tail -30
          echo "=== missions ==="; ls -la "$AUCTERIS_DATA_DIR/missions/" 2>/dev/null
          for d in "$AUCTERIS_DATA_DIR/missions/"*/; do
            echo "--- $d"; find "$d" -type f | head -20
          done
          echo "=== restate errors ==="
          grep -iE "error|fail|retry" "$RUNNER_TEMP/restate.log" 2>/dev/null | tail -30

  temporal-integration:
    # Real temporal dev-server + real worker + real kill/restart drill.
    # Same deterministic mock runtime — no provider credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install protoc (temporalio-protos build dep)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build aucteris
        run: cargo build

      - name: Install temporal CLI
        run: |
          curl -sL -o /tmp/temporal.tar.gz \
            https://github.com/temporalio/cli/releases/download/v1.10.0/temporal_cli_1.10.0_linux_amd64.tar.gz
          tar -xzf /tmp/temporal.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/temporal" --version

      - name: Start temporal dev server
        run: |
          "$RUNNER_TEMP/temporal" server start-dev \
            --ip 127.0.0.1 --port 7233 --ui-port 8233 \
            --db-filename "$RUNNER_TEMP/temporal-dev.db" \
            > "$RUNNER_TEMP/temporal.log" 2>&1 &
          for i in $(seq 1 60); do
            (exec 3<>/dev/tcp/localhost/7233) 2>/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/temporal.log"; exit 1

      - name: Start aucteris temporal worker
        env:
          AUCTERIS_ENGINE: temporal
          AUCTERIS_DATA_DIR: ${{ runner.temp }}/aucteris-temporal-data
          TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: |
          ./target/debug/aucteris-core serve > "$RUNNER_TEMP/tworker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/tworker.pid"
          sleep 3
          grep -q "temporal worker polling" "$RUNNER_TEMP/tworker.log" || { cat "$RUNNER_TEMP/tworker.log"; exit 1; }

      - name: Temporal durable mission end-to-end
        env:
          AUCTERIS_ENGINE: temporal
          AUCTERIS_DATA_DIR: ${{ runner.temp }}/aucteris-temporal-data
          TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: |
          OUT=$(./target/debug/aucteris-core run-durable tests/fixtures/mission-mock-ok.yaml)
          echo "$OUT"
          MID=$(echo "$OUT" | sed -n 's/mission \(m-[^ ]*\).*/\1/p')
          test -n "$MID"
          for i in $(seq 1 90); do
            F="$AUCTERIS_DATA_DIR/missions/$MID/durable-result.json"
            [ -f "$F" ] && grep -q '"engine":"temporal"' "$F" && grep -q "write:completed" "$F" && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/tworker.log"; exit 1

      - name: Temporal approval gate (reject)
        env:
          AUCTERIS_ENGINE: temporal
          AUCTERIS_DATA_DIR: ${{ runner.temp }}/aucteris-temporal-data
          TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: |
          OUT=$(./target/debug/aucteris-core run-durable tests/fixtures/mission-mock-approval.yaml --approval)
          MID=$(echo "$OUT" | sed -n 's/mission \(m-[^ ]*\).*/\1/p')
          test -n "$MID"
          sleep 5
          ./target/debug/aucteris-core approve "$MID" rejected
          for i in $(seq 1 60); do
            F="$AUCTERIS_DATA_DIR/missions/$MID/durable-result.json"
            [ -f "$F" ] && grep -q "rejected" "$F" && exit 0
            sleep 1
          done
          exit 1

      - name: Kill temporal worker mid-attempt, verify reconcile
        env:
          AUCTERIS_ENGINE: temporal
          AUCTERIS_DATA_DIR: ${{ runner.temp }}/aucteris-temporal-data
          TEMPORAL_ADDRESS: 127.0.0.1:7233
        run: |
          OUT=$(./target/debug/aucteris-core run-durable tests/fixtures/mission-mock-sleep.yaml)
          MID=$(echo "$OUT" | sed -n 's/mission \(m-[^ ]*\).*/\1/p')
          test -n "$MID"
          echo "mission=$MID"
          for i in $(seq 1 30); do
            ls "$AUCTERIS_DATA_DIR/missions/$MID/attempts/"*.json >/dev/null 2>&1 && break
            sleep 1
          done
          sleep 3
          kill -9 "$(cat "$RUNNER_TEMP/tworker.pid")" || true
          echo "worker killed"
          # Restart the worker; Temporal heartbeat timeout (~60s)
          # detects the dead worker, retries the activity, and the
          # retried activity reconciles the orphan to unknown first.
          AUCTERIS_ENGINE=temporal AUCTERIS_DATA_DIR="$AUCTERIS_DATA_DIR" \
            TEMPORAL_ADDRESS=127.0.0.1:7233 \
            ./target/debug/aucteris-core serve > "$RUNNER_TEMP/tworker2.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/tworker.pid"
          sleep 2
          for i in $(seq 1 240); do
            F="$AUCTERIS_DATA_DIR/missions/$MID/durable-result.json"
            [ -f "$F" ] && grep -q "slow-write:completed" "$F" && break
            sleep 1
          done
          echo "=== durable-result ==="
          cat "$AUCTERIS_DATA_DIR/missions/$MID/durable-result.json" 2>/dev/null || echo MISSING
          grep -q "slow-write:completed" "$AUCTERIS_DATA_DIR/missions/$MID/durable-result.json"
          grep -q "marked unknown" "$AUCTERIS_DATA_DIR/missions/$MID/evidence.jsonl"
          echo "=== attempts ==="
          ls "$AUCTERIS_DATA_DIR/missions/$MID/attempts/"
          test "$(ls "$AUCTERIS_DATA_DIR/missions/$MID/attempts/"*.json | wc -l)" -eq 2

      - name: Dump mission artifacts on failure
        if: failure()
        env:
          AUCTERIS_DATA_DIR: ${{ runner.temp }}/aucteris-temporal-data
        run: |
          echo "=== tworker.log ==="; cat "$RUNNER_TEMP/tworker.log" 2>/dev/null | tail -30
          echo "=== tworker2.log ==="; cat "$RUNNER_TEMP/tworker2.log" 2>/dev/null | tail -30
          echo "=== temporal.log ==="; cat "$RUNNER_TEMP/temporal.log" 2>/dev/null | tail -30
          for d in "$AUCTERIS_DATA_DIR/missions/"*/; do
            echo "--- $d"; find "$d" -type f | head -20
          done
