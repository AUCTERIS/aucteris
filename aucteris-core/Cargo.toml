[package]
name = "aucteris-core"
version = "0.1.0"
edition = "2021"
description = "Aucteris Core: controlled, verifiable execution of work by specialized agents"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
ctrlc = "3"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
restate-sdk = { version = "0.12", features = ["reqwest-client"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = "0.13"
futures-util = "0.3.34"
temporalio-sdk = "1.2.0"
temporalio-client = "1.2.0"
temporalio-macros = "1.2.0"
futures = "0.3"
temporalio-common = "1.2.0"
temporalio-workflow = "1.2.0"
